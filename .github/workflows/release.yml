name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: hkwatch-x86_64-linux
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: hkwatch-aarch64-macos
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: hkwatch-x86_64-macos
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: hkwatch-x86_64-windows.exe
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cd watcher && cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          cd watcher
          cp target/${{ matrix.target }}/release/hkwatch${{ matrix.ext }} ../${{ matrix.artifact }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          generate_release_notes: false
